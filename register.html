<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Schemesathi</title>

<style>

/* GLOBAL THEME */
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #dfe9f3, #c3dfe8, #d4fcf4);
  color: #1a2a33;
}

/* Overlay */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at top left, rgba(255,255,255,0.4), transparent);
  z-index: -1;
}

/* Navbar */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 60px;
  background-color: #2c5d73;
  color: white;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.nav-links {
  display: flex;
  gap: 25px;
  align-items: center;
}

.nav-links a {
  text-decoration: none;
  color: white;
}

/* Register Section */
.register-container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 85vh;
}

/* Form Box */
.register-box {
  background: white;
  padding: 40px;
  border-radius: 15px;
  width: 380px;
  box-shadow: 0 8px 20px rgba(44,93,115,0.2);
  text-align: center;
}

.register-box h2 {
  margin-bottom: 25px;
  color: #1b3c53;
}

/* Inputs */
.input-group {
  margin-bottom: 18px;
  text-align: left;
}

.input-group input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

/* Button */
.register-btn {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 20px;
  background-color: #2c5d73;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.extra {
  margin-top: 15px;
}

</style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
  <div class="logo">Schemesathi</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="register.html" class="active">Register</a>
    <a href="scheme.html">Scheme</a>
  </div>
</div>

<!-- Register Form -->
<div class="register-container">
  <div class="register-box">
    <h2>Create Account</h2>

    <form id="registerForm">

      <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" required>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>

      <div class="input-group">
        <label>Contact Number</label>
        <input type="tel" id="contact" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>

      <button type="submit" class="register-btn">Register</button>

      <div class="extra">
        <p>Already have an account? <a href="login.html">Login Here</a></p>
      </div>

    </form>

  </div>
</div>

<!-- Script -->
<script>

document.getElementById("registerForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  let username = document.getElementById("username").value;
  let email = document.getElementById("email").value;
  let contact = document.getElementById("contact").value;
  let password = document.getElementById("password").value;

  try {
    let res = await fetch("http://localhost:3000/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ username, email, contact, password })
    });

    let data = await res.json();

    if (data.success) {
      alert("Registered Successfully ✅");
      window.location.href = "login.html";
    } else {
      alert("Registration Failed ❌\nReason: " + (data.message || "Unknown error"));
    }

  } catch (err) {
    console.error(err);
    alert("Server not running ❌\nDetailed Error: " + err.message);
  }

});

</script>

<script src="nav.js"></script>
</body>
</html>
