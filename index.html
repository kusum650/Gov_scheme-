<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schemesathi</title>

<style>

/* GLOBAL THEME */
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #dfe9f3, #c3dfe8, #d4fcf4);
  color: #1a2a33;
}

/* Overlay effect */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at top left, rgba(255,255,255,0.4), transparent);
  z-index: -1;
}

/* Navbar */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 60px;
  background-color: #2c5d73;
  color: white;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.nav-links {
  display: flex;
  gap: 25px;
  align-items: center;
}

.nav-links a {
  text-decoration: none;
  color: white;
}

.btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: none;
  background-color: white;
  color: #2c5d73;
  cursor: pointer;
}

/* Main Section */
.container {
  display: flex;
  padding: 60px;
  align-items: center;
}

/* Left */
.left {
  flex: 1;
}

.left h1 {
  font-size: 42px;
  color: #1b3c53;
}

.left p {
  font-size: 18px;
  max-width: 500px;
  color: #2f4f5f;
}

/* Right */
.right {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 40px;
  justify-items: center;
}

/* Circle UI */
.circle-box {
  text-align: center;
  width: 220px;
  cursor: pointer;
  transition: 0.3s;
}

.circle-box:hover {
  transform: scale(1.08);
}

/* Circle Design */
.big-circle {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  overflow: hidden;
  margin: auto;

  border: 5px solid #2c5d73;
  box-shadow: 0 6px 15px rgba(44,93,115,0.3);
}

.big-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

</style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
  <div class="logo">Schemesathi</div>

  <div class="nav-links">
    <a href="#" onclick="location.reload()">Home</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
    <a href="scheme.html">Scheme</a>
    <button class="btn">Multi Lang</button>
  </div>
</div>

<!-- Main Section -->
<div class="container">

  <!-- Left Side -->
  <div class="left">
    <h1>Find the Best Government Schemes Easily</h1>
    <p>
      Schemesathi helps you discover government schemes for students,
      farmers, women, and more. Get complete details in one place.
    </p>
  </div>

  <!-- Right Side -->
  <div class="right">

    <div class="circle-box" onclick="location.href='scheme.html'">
      <div class="big-circle">
        <img src="student.png">
      </div>
    </div>

    <div class="circle-box" onclick="location.href='scheme.html'">
      <div class="big-circle">
        <img src="farmer.png">
      </div>
    </div>

    <div class="circle-box" onclick="location.href='scheme.html'">
      <div class="big-circle">
        <img src="sports.png">
      </div>
    </div>

    <div class="circle-box" onclick="location.href='scheme.html'">
      <div class="big-circle">
        <img src="business.png">
      </div>
    </div>

  </div>

</div>

<script src="nav.js"></script>
</body>
</html>
